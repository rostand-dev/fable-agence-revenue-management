# NuitSignal — déploiement Coolify (Docker Compose) ou local : docker compose up --build
# Coolify génère le domaine (SERVICE_URL_APP_3000) et le mot de passe PostgreSQL (SERVICE_PASSWORD_POSTGRES).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Coolify génère le domaine public de l'application et le transmet ici (port 3000).
      - SERVICE_URL_APP_3000
      # Adresse publique de l'application (liens des e-mails ; cookies sécurisés si https). Reprend le domaine généré par Coolify.
      - APP_URL=${SERVICE_URL_APP:-http://localhost:3000}
      # Chaîne de connexion à la base du service db ci-dessous ; le mot de passe est généré par Coolify.
      - DATABASE_URL=postgresql://nuitsignal:${SERVICE_PASSWORD_POSTGRES:-nuitsignal_local}@db:5432/nuitsignal
      # Isolation entre propriétaires par la base (RLS, US-011) : off par défaut ; on = lectures sensibles sous le rôle restreint nuitsignal_app, et /api/health en erreur si l'isolation manque.
      # Passer à on une fois /api/health affiché avec "tenantIsolation":"available" (la migration crée le rôle au démarrage). Facultatif.
      - TENANT_RLS=${TENANT_RLS:-off}
      # Durée minimale d'observation avant activation d'un logement, en jours (US-024) : 14 par défaut, de 0 à 90 ; une valeur invalide revient à 14.
      # 0 supprime le délai (activation possible dès le lancement) : réserver aux tests/préproduction. Facultatif.
      - ACTIVATION_SHADOW_MIN_DAYS=${ACTIVATION_SHADOW_MIN_DAYS:-14}
      # Masquage des données personnelles (e-mails, téléphones, IBAN, cartes, secrets) dans les journaux du serveur (US-034) : on par défaut ; off = débogage local seulement, jamais en production ni en staging.
      - LOG_PII_MASKING=${LOG_PII_MASKING:-on}
      # Adresse publique des webhooks SuperHote (https) ; vide = APP_URL. Voir .env.example.
      - SUPERHOTE_WEBHOOK_BASE_URL=${SUPERHOTE_WEBHOOK_BASE_URL:-}
      # Clé qui chiffre les clés API enregistrées (PriceLabs, SuperHote, et les clés de modèles Anthropic, OpenAI, Mistral des propriétaires). Générée par Coolify ; la changer rend illisibles les clés déjà enregistrées.
      - APP_SECRET=${SERVICE_PASSWORD_64_APPSECRET:-secret_local_a_remplacer_0123456789}
      # Facultatif : modèle Anthropic de démarrage du routeur. Utilisé avec la clé Anthropic du propriétaire tant qu'aucun modèle n'est qualifié pour une tâche (« démarrage sans régression »).
      # Le serveur ne détient aucune clé de modèle : chaque propriétaire saisit les siennes (Anthropic, OpenAI, Mistral) dans Paramètres › IA & modèles › Clés fournisseurs.
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # Facultatif : adresse de l'API Mistral (tests avec un faux serveur). Défaut : https://api.mistral.ai.
      - MISTRAL_API_BASE=${MISTRAL_API_BASE:-https://api.mistral.ai}
      # Facultatif : adresse (https) du fichier de prix open source de LiteLLM, lu chaque jour pour connaître le prix des modèles. Un prix modifié n'est appliqué qu'après validation dans l'application.
      - LLM_PRICES_URL=${LLM_PRICES_URL:-https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
      # Facultatif : surcharges de prix, JSON {"modèle": {"input": 1, "output": 5}} en USD par million de jetons (modèle absent du fichier LiteLLM, ou prix à forcer). vide = aucune.
      - LLM_PRICE_OVERRIDES=${LLM_PRICE_OVERRIDES:-}
      # Facultatif : fréquence du job de mise à jour des prix et de la disponibilité des modèles, en heures (défaut 24, de 1 à 168 ; 0 désactive le job).
      - LLM_SYNC_INTERVAL_HOURS=${LLM_SYNC_INTERVAL_HOURS:-24}
      # Facultatif : taux fixe dollar → euro pour exprimer le coût des modèles et le plafond mensuel en euros (défaut 0.92 ; à ajuster à la main).
      - LLM_USD_EUR_RATE=${LLM_USD_EUR_RATE:-0.92}
      # Facultatif : adresses e-mail (séparées par des virgules) de l'exploitant, seules autorisées à valider un changement de prix de modèle et à lancer un test de modèle (réglages partagés par tous les comptes). Vide : personne.
      - LLM_ADMIN_EMAILS=${LLM_ADMIN_EMAILS:-}
      # Facultatif : appels HTTP aux fournisseurs de modèle au plus par revue (défaut 80 ; corrections et replis comptés). Au-delà, les agents passent en repli déterministe pour le reste de la revue. 0 désactive les appels de modèle.
      - AGENT_MAX_CALLS_PER_REVIEW=${AGENT_MAX_CALLS_PER_REVIEW:-80}
      # Facultatif : jetons (entrée + sortie) au plus par propriétaire et par jour UTC (défaut 300000). Atteint : repli déterministe jusqu'au lendemain. 0 désactive les appels de modèle.
      - AGENT_DAILY_TOKEN_BUDGET=${AGENT_DAILY_TOKEN_BUDGET:-300000}
      # Verrou d'écriture chez PriceLabs (épic 9) : « true » autorise NuitSignal à modifier les prix d'un logement réel (prix minimum, de base, prix datés à prix fixe) ; tout autre valeur = fermé (défaut « false »).
      # Les logements de démonstration restent toujours simulés. À n'ouvrir qu'après la procédure de première écriture (docs/epic-9-execution-pricelabs.md). Facultatif.
      - PRICELABS_WRITE_ENABLED=${PRICELABS_WRITE_ENABLED:-false}
      # Facultatif : minutes d'inactivité avant déconnexion automatique (défaut 15, minimum 2). Sur la démo, la session expirée se rouvre seule.
      - SESSION_IDLE_MINUTES=${SESSION_IDLE_MINUTES:-15}
      # Facultatif : jours pendant lesquels un appareil reste reconnu après « Rester connecté sur cet appareil » (défaut 30, de 1 à 90 ; 0 désactive la fonction).
      - REMEMBER_ME_DAYS=${REMEMBER_ME_DAYS:-30}
      # Clé API Resend pour envoyer les e-mails (mot de passe oublié, confirmation d'inscription, alertes d'exécution PriceLabs). Vide = aucun e-mail envoyé (les alertes restent visibles dans l'écran « Alertes »).
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # Expéditeur des e-mails, sur un domaine vérifié dans Resend. Ex. : NuitSignal <no-reply@votre-domaine.fr>
      - EMAIL_FROM=${EMAIL_FROM:-}
      # Facultatif : adresse de réponse des e-mails envoyés.
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      # Durée de validité du lien de réinitialisation, en minutes (défaut 30, entre 5 et 120).
      - PASSWORD_RESET_MINUTES=${PASSWORD_RESET_MINUTES:-30}
      # Inscription : confirmation de l'adresse par e-mail avant création du compte (nécessite Resend).
      # Mettre false en preview pour créer le compte immédiatement, sans e-mail (révèle alors les adresses déjà inscrites).
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-true}
      # Commit Git déployé, repris de SOURCE_COMMIT (fourni par Coolify) et affiché par /api/health : la CI s'en sert pour attendre que la Preview soit à jour. Vide = commit non publié.
      - APP_COMMIT=${SOURCE_COMMIT:-}
      # Preview uniquement (variables « Preview Deployment » de Coolify ; ne rien définir en production, sur la démo ni sur le staging) : identifiant exigé (HTTP Basic) pour ouvrir l'application. Vide = pas de protection.
      - PREVIEW_BASIC_AUTH_USER=${PREVIEW_BASIC_AUTH_USER:-}
      # Mot de passe associé, 12 caractères au moins. Si l'un des deux est renseigné sans l'autre (ou un mot de passe trop court), l'accès est refusé (503) plutôt qu'ouvert. /api/health reste accessible sans mot de passe.
      - PREVIEW_BASIC_AUTH_PASSWORD=${PREVIEW_BASIC_AUTH_PASSWORD:-}
      # Compte de démo (test/preview uniquement, ne rien définir en production) : créé au démarrage s'il n'existe pas.
      # Interrupteur : true crée le compte ; il faut aussi un domaine de APP_URL correspondant à DEMO_ACCOUNT_ALLOWED_HOST et un mot de passe de 10 caractères au moins.
      - DEMO_ACCOUNT_ENABLED=${DEMO_ACCOUNT_ENABLED:-false}
      # Domaine autorisé : motif exact (demo.exemple.fr) ou joker de tête (*.nuit-signal.rosyops.io, qui ne couvre pas le domaine nu de la production).
      - DEMO_ACCOUNT_ALLOWED_HOST=${DEMO_ACCOUNT_ALLOWED_HOST:-}
      # Adresse e-mail de connexion du compte de démo.
      - DEMO_ACCOUNT_EMAIL=${DEMO_ACCOUNT_EMAIL:-}
      # Mot de passe du compte de démo (10 caractères au moins). Non modifié si le compte existe déjà.
      - DEMO_ACCOUNT_PASSWORD=${DEMO_ACCOUNT_PASSWORD:-}
      # Facultatif : nom affiché du compte de démo (défaut : Compte démo).
      - DEMO_ACCOUNT_NAME=${DEMO_ACCOUNT_NAME:-}
      # Démo publique (application de la démo uniquement) : true refuse toute modification et ouvre /demo. Ne jamais définir en production ni en preview.
      - DEMO_READONLY=${DEMO_READONLY:-false}
      # Sur la démo : adresse de création de compte sur la production (bandeau et bouton « Quitter la démo »).
      - DEMO_SIGNUP_URL=${DEMO_SIGNUP_URL:-}
      # Sur la production : adresse de la démo. Affiche « Voir la démo, sans compte » sur la page de connexion ; vide = pas de bouton.
      - DEMO_URL=${DEMO_URL:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Utilisateur PostgreSQL créé au premier démarrage du service.
      - POSTGRES_USER=nuitsignal
      # Mot de passe PostgreSQL, généré par Coolify (même valeur que dans DATABASE_URL).
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-nuitsignal_local}
      # Nom de la base créée au premier démarrage.
      - POSTGRES_DB=nuitsignal
    volumes:
      - nuitsignal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuitsignal -d nuitsignal"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  nuitsignal-db:
