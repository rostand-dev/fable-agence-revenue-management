# NuitSignal — landing : serveur statique (image nginx non privilégiée, port 8080).
# TLS et domaine sont gérés en amont par le proxy de Coolify (Traefik).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  etag on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Images et polices : noms non hachés, donc cache court (1 jour) puis revalidation par ETag.
  location ~* \.(?:webp|png|jpg|svg|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400" always;
    try_files $uri =404;
  }

  # CSS, JS (dont config.js, régénéré à chaque démarrage) et HTML : toujours revalidés (ETag, réponse 304 si inchangés),
  # pour qu'un HTML neuf ne tourne jamais avec un script ancien après un déploiement.
  location ~* \.(?:css|js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
}
