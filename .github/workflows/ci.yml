# NuitSignal : intégration continue.
# Dépôt public : les runners GitHub standard sont gratuits et sans limite de minutes.
# Ce workflow ne reçoit aucun secret et ne déploie rien : le déploiement reste assuré par Coolify.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Lecture seule du dépôt, aucune autre permission.
permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente de cette PR (jamais celles de main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Types TypeScript et tests purs (moteur, règles, cumul, correspondances d'intégrations, idempotence statique des migrations).
  typecheck-tests:
    name: Typecheck et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Le jeton Git n'a pas besoin de rester dans .git/config : aucun job ne pousse quoi que ce soit.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Golden cases du moteur et des agents IA (US-075) : fournisseur scripté, aucun réseau, aucune écriture externe (contrôle statique des imports).
      # Déjà inclus dans « npm test » ; l'étape dédiée rend l'échec lisible dans la CI.
      - run: npm run test:golden

  # Tests d'intégration sur une vraie base PostgreSQL 16 jetable, y compris le rejeu double des migrations
  # (src/lib/migrations.db.test.ts) : une migration non rejouable fait échouer la CI.
  tests-base-de-donnees:
    name: Tests base de données
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Le nom doit contenir « test » : le lanceur de tests refuse de vider une autre base.
          POSTGRES_DB: nuitsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nuitsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Base jetable du service ci-dessus, vidée puis migrée à chaque lancement des tests.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuitsignal_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Le jeton Git n'a pas besoin de rester dans .git/config : aucun job ne pousse quoi que ce soit.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db

  # Compilation de production de Next.js : détecte les erreurs que le typecheck seul ne voit pas.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Le jeton Git n'a pas besoin de rester dans .git/config : aucun job ne pousse quoi que ce soit.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Tests de bout en bout dans un vrai navigateur (Playwright), bureau et mobile (390 px et 360 px), sur l'application construite
  # et lancée dans la CI avec une base PostgreSQL jetable et le compte de démo. Aucun secret : tout est généré pour la CI.
  # Le rapport HTML, les captures et les traces sont joints à l'exécution (onglet « Artifacts »).
  tests-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuitsignal_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nuitsignal_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Base jetable du service ci-dessus.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuitsignal_e2e
      # Clé de chiffrement des clés API : valeur factice, propre à la CI (aucune donnée réelle n'est stockée).
      APP_SECRET: ci-e2e-secret-0123456789abcdef
      # Adresse publique fictive : le compte de démo n'est créé que si son domaine correspond à DEMO_ACCOUNT_ALLOWED_HOST.
      APP_URL: http://e2e.nuit-signal.test:3000
      DEMO_ACCOUNT_ENABLED: "true"
      DEMO_ACCOUNT_ALLOWED_HOST: e2e.nuit-signal.test
      DEMO_ACCOUNT_EMAIL: demo-e2e@example.test
      DEMO_ACCOUNT_PASSWORD: ci-e2e-demo-passw0rd
      # Création de compte immédiate, sans e-mail de confirmation (aucun envoi d'e-mail en CI).
      SIGNUP_EMAIL_CONFIRMATION: "false"
      # Faux serveur de l'API PriceLabs (scripts/fake-pricelabs-server.ts), lancé par Playwright : l'application le lit comme elle lirait PriceLabs. Aucune clé ni donnée réelle.
      PRICELABS_API_BASE: http://127.0.0.1:4010/v1
      # PRICELABS_WRITE_ENABLED est volontairement absent : l'écriture réelle chez PriceLabs reste fermée en CI, et le test e2e vérifie l'affichage « Désactivée sur cet environnement ».
      # Faux serveur de modèle de langage (scripts/fake-llm-server.ts), lancé par Playwright : les agents l'interrogent comme ils interrogeraient Anthropic. Clé factice, aucun appel externe.
      ANTHROPIC_API_BASE: http://127.0.0.1:4011
      OPENAI_API_BASE: http://127.0.0.1:4011
      MISTRAL_API_BASE: http://127.0.0.1:4011/mistral
      # Clé factice enregistrée comme clé Anthropic du propriétaire du compte de démo (le serveur ne détient aucune clé de modèle) ; acceptée seulement parce que ANTHROPIC_API_BASE est local.
      DEMO_ACCOUNT_LLM_KEY: ci-fake-llm-key-0123456789
      # Le compte de démo de la CI joue l'exploitant : il peut valider un prix et lancer un test de modèle.
      LLM_ADMIN_EMAILS: demo-e2e@example.test
      # Le job de mise à jour des prix et modèles LLM va sur Internet (fichier de prix, listes des fournisseurs) : coupé en CI, comme tout appel externe.
      LLM_SYNC_INTERVAL_HOURS: "0"
      # Identifiants que Playwright saisit pour se connecter : ceux du compte de démo ci-dessus.
      E2E_EMAIL: demo-e2e@example.test
      E2E_PASSWORD: ci-e2e-demo-passw0rd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Landing statique (landing/) : rendu dans un vrai navigateur, bureau, tablette et mobile (390 et 360 px), thème clair et sombre,
  # mouvement réduit, et aucune erreur JavaScript ni ressource manquante. Pas de base de données ni de compte : un serveur statique suffit.
  landing:
    name: Landing (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # L'image de production est construite et lancée telle que Coolify la lancera : nginx, en-têtes de sécurité (CSP stricte),
      # page 404 et config.js généré depuis LANDING_APP_URL. Les tests tournent contre elle, pas contre un serveur de développement.
      - run: docker build -t nuitsignal-landing landing
      - run: docker run -d --name landing -p 8080:8080 -e LANDING_APP_URL=https://connect.nuitsignal.rosyops.io nuitsignal-landing
      - run: for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done; docker logs landing; exit 1
      - run: npm run e2e:landing
        env:
          # Adresse de la landing lancée ci-dessus, et adresse d'application attendue dans config.js.
          LANDING_BASE_URL: http://127.0.0.1:8080
          LANDING_EXPECTED_APP_URL: https://connect.nuitsignal.rosyops.io
      - if: ${{ failure() }}
        run: docker logs landing
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-landing
          path: |
            playwright-report/landing/
            test-results/landing/
          retention-days: 7
          if-no-files-found: ignore
