<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture NuitSignal</title>
<style>
/* VOICE: analytique et précise, celle du cockpit NuitSignal : nommer chaque composant, chaque flux et sa cadence.
   IDEA: une carte du ciel d'architecte, lue comme un plan : plus on s'approche, plus les constellations se détaillent.
   PICTURE: le schéma lui-même, plein écran, avec un zoom sémantique en trois niveaux (composants, couches, modules).
   COLOUR and TYPE: tokens Deep Space du design system (fond #04050a, verre, bleu #60a5fa, violet #a78bfa, ambre garde-fou), police système et monospace.
   LAYOUT: barre de titre, toile infinie, inspecteur à droite (panneau du bas sur mobile), commandes de zoom flottantes. */
:root{color-scheme:dark;
  --space-900:#04050a;--space-700:#0b0e1a;--surface:rgb(255 255 255/4.5%);--surface-high:rgb(255 255 255/7%);
  --line:rgb(255 255 255/9%);--line-strong:rgb(255 255 255/16%);--ink:#eef1f8;--quiet:#9aa4bf;--faint:#8b94ad;
  --blue:#60a5fa;--blue-core:#2563eb;--violet:#a78bfa;--violet-core:#7c3aed;--emerald:#34d399;--amber-ink:#fcd34d;--focus:#7dd3fc;
  --action:linear-gradient(135deg,var(--blue-core),var(--violet-core));
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --top:56px;--panel:360px;--peek:68px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;font:16px/1.6 var(--font);color:var(--ink);overflow:hidden;background-color:var(--space-900);
  background-image:radial-gradient(900px 600px at 14% -8%,rgb(37 99 235/22%),transparent 70%),radial-gradient(760px 520px at 92% 4%,rgb(124 58 237/20%),transparent 72%),radial-gradient(640px 480px at 60% 108%,rgb(34 211 238/10%),transparent 70%),linear-gradient(180deg,var(--space-700),var(--space-900) 62%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{height:var(--top);display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:rgb(4 5 10/55%);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand b{font-size:16px;letter-spacing:-.01em}.brand span{color:var(--quiet);font-size:14px}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;overflow:hidden;white-space:nowrap;font-size:14px;color:var(--quiet)}
.crumbs button{background:none;border:0;padding:6px 4px;color:var(--blue);cursor:pointer;border-radius:6px}
.crumbs .sep{color:var(--faint)}.crumbs .cur{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.levels{display:flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--surface);flex:none}
.levels button{border:0;background:none;border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;color:var(--quiet);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .18s,color .18s}
.levels button i{font-style:normal;font-family:var(--mono);font-size:12px;opacity:.8}
.levels button[aria-pressed=true]{background:var(--action);color:#fff}
.stage{position:relative;height:calc(100% - var(--top));display:grid;grid-template-columns:minmax(0,1fr) var(--panel)}
.canvas{position:relative;overflow:hidden;touch-action:none}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#svg:active{cursor:grabbing}
.zoombar{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-strong);background:rgb(11 14 26/85%);cursor:pointer;display:grid;place-items:center;transition:background .18s}
.zoombar button:hover{background:var(--surface-high)}
.status{position:absolute;right:16px;bottom:16px;font-size:13px;color:var(--quiet);background:rgb(11 14 26/80%);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));font-size:14px;color:var(--ink);background:rgb(11 14 26/90%);border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;text-align:center;transition:opacity .4s}
.hint.off{opacity:0;pointer-events:none}
/* inspecteur */
.panel{border-left:1px solid var(--line);background:rgb(8 10 20/78%);backdrop-filter:blur(12px);display:flex;flex-direction:column;overflow:hidden}
.grab{display:none}
.pbody{overflow-y:auto;padding:20px;flex:1}
.phead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.phead .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-high);border:1px solid var(--line);flex:none}
.phead.ext .ico{border-style:dashed}
h2{font-size:20px;line-height:1.25;margin:0}h3{font-size:14px;margin:22px 0 8px;color:var(--quiet);font-weight:600}
.muted{color:var(--quiet);font-size:14px;margin:2px 0 0}
.pbody p{margin:0 0 10px;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn{min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px}
.btn.pri{background:var(--action);border-color:transparent;color:#fff}
.layers{list-style:none;margin:0;padding:0}
.layers li.ly{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.layers li.ly b{display:flex;gap:8px;align-items:baseline;font-size:15px}
.layers li.ly b em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--faint)}
.layers li.ly p{font-size:14px;color:var(--quiet);margin:2px 0 6px}
.layers li.ix{font-size:13px;color:var(--faint);padding:4px 0 4px 18px}
.layers li.gap{height:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid rgb(96 165 250/30%);background:rgb(96 165 250/10%);color:#cfe0ff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--amber-ink);font-weight:500}
.tag::before{content:"";width:7px;height:7px;background:var(--amber-ink);transform:rotate(45deg)}
.xf{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.xf li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.xf button{background:none;border:0;padding:6px 0;min-height:32px;color:var(--blue);cursor:pointer;text-align:left;font-size:14px}
.xf small{display:block;color:var(--faint);font-size:12px}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}
.legend li{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px}
.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.nav button{min-height:44px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;line-height:1.3}
.nav button.ext{border-style:dashed}
.nav button:hover,.btn:hover{background:var(--surface-high)}
.steps{margin:0 0 8px;padding-left:20px;font-size:15px}.steps li{margin:2px 0}
.src{font-size:12px;color:var(--faint);margin-top:22px!important}
/* SVG */
svg text{font-family:var(--font)}
.body{fill:rgb(14 18 34/94%);stroke:rgb(255 255 255/14%);stroke-width:calc(1px / var(--k,1))}
.ext .body{fill:rgb(9 11 22/92%);stroke:rgb(255 255 255/22%);stroke-dasharray:calc(5px / var(--k,1)) calc(4px / var(--k,1))}
.node{cursor:pointer;transition:opacity .25s}
.node:hover .body,.node.on .body{stroke:rgb(255 255 255/32%)}
.node.sel .body{stroke:url(#act);stroke-width:calc(2.2px / var(--k,1))}
.node:focus{outline:none}.node:focus-visible .body{stroke:var(--focus);stroke-width:calc(2px / var(--k,1))}
.h1{fill:var(--ink);font-weight:650}.h2{fill:var(--quiet)}
.bandr{stroke-width:calc(1px / var(--k,1))}
.b0{fill:rgb(96 165 250/7%);stroke:rgb(96 165 250/20%)}.b1{fill:rgb(167 139 250/7%);stroke:rgb(167 139 250/20%)}
.band:hover .bandr{fill:rgb(255 255 255/9%)}
.bt text{fill:var(--ink);font-weight:600}.bt .bi{fill:var(--faint);font-family:var(--mono);font-weight:400}.bt .st{fill:var(--amber-ink);font-weight:500}
.bt{transition:transform .35s ease}
.bd{fill:var(--quiet)}
.cr{fill:rgb(96 165 250/10%);stroke:rgb(96 165 250/32%);stroke-width:calc(.8px / var(--k,1))}.ct{fill:#cfe0ff;font-family:var(--mono)}
.il{fill:var(--faint)}.ia{fill:var(--quiet);stroke:var(--quiet)}
.l0 .t0{fill:var(--ink);font-weight:650}.l0 .k0{fill:var(--quiet)}
.etag rect{fill:none;stroke:rgb(255 255 255/30%);stroke-width:calc(.8px / var(--k,1))}.etag text{fill:var(--quiet)}
.l0,.l1,.l2{transition:opacity .28s ease}
svg.lv1 .l0,svg.lv2 .l0{opacity:0}
svg.lv0 .l1{opacity:0;pointer-events:none}
svg.lv0 .l2,svg.lv1 .l2{opacity:0}
svg.lv2 .bt{transform:translateY(var(--dy))}
.flow{fill:none;stroke-width:calc(1.6px / var(--k,1));transition:opacity .25s}
.k-write{stroke-width:calc(2.6px / var(--k,1))}
.k-event{stroke-dasharray:calc(8px / var(--k,1)) calc(5px / var(--k,1))}
.k-mail{stroke-dasharray:calc(2px / var(--k,1)) calc(4px / var(--k,1))}
.k-trans{stroke-dasharray:calc(1.5px / var(--k,1)) calc(5px / var(--k,1));opacity:.8}
.hit{fill:none;stroke:transparent;stroke-width:calc(16px / var(--k,1));cursor:help}
.head{transition:opacity .25s}
svg:not(.lv0) .flow:not(.on),svg:not(.lv0) .head:not(.on){opacity:.14}
svg.focusing .flow:not(.on),svg.focusing .head:not(.on){opacity:.09}
svg.focusing.lv0 .node:not(.on):not(.near){opacity:.42}
.flow.on{stroke-width:calc(2.2px / var(--k,1));stroke-dasharray:calc(10px / var(--k,1)) calc(6px / var(--k,1));animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:calc(-16px / var(--k,1))}}
.flab{pointer-events:none}.flab rect{fill:rgb(8 10 20/92%);stroke:rgb(255 255 255/16%)}.flab text{fill:var(--ink)}
.flab.on rect{stroke:var(--blue)}
.frame{fill:rgb(255 255 255/1.5%);stroke:rgb(167 139 250/30%);stroke-width:calc(1.2px / var(--k,1));stroke-dasharray:calc(10px / var(--k,1)) calc(6px / var(--k,1))}
.ftab text{fill:var(--violet);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.flow.on{animation:none}}
@media (max-width:999px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:var(--peek);border-left:0;border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;transition:max-height .3s ease;z-index:5}
  .panel.open{max-height:62%}
  .grab{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--peek);padding:10px 16px;border:0;background:none;cursor:pointer;text-align:left;flex:none}
  .grab::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--line-strong);transform:translateX(-50%)}
  .grab strong{font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grab span{font-size:13px;color:var(--quiet);flex:none}
  .pbody{padding-top:0}
  .panel:not(.open) .pbody{visibility:hidden}
  .zoombar{bottom:calc(var(--peek) + 12px)}.status{bottom:calc(var(--peek) + 12px)}
}
@media (max-width:640px){
  .top{gap:10px;padding:0 10px}.brand span,.brand b,.crumbs{display:none}.hint .lg{display:none}
  .zoombar{flex-direction:row}
  .levels{margin-left:auto}.levels button{padding:6px 10px;font-size:13px}
  .status{display:none}
}
@media (max-width:440px){.levels button i{display:none}.levels button{padding:6px 9px}}
@media (min-width:641px){.hint .sm{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="28" height="25" viewBox="0 0 72 64" aria-hidden="true"><defs><linearGradient id="ba" x1="7" y1="4" x2="28" y2="59" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient><linearGradient id="bb" x1="64" y1="2" x2="27" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><path fill="url(#ba)" d="M7 9C7 5 11 4 15 7L28 17C20 27 19 39 27 49V59C15 58 7 52 7 43Z"/><path fill="url(#bb)" d="M49 2C60 5 64 14 64 23V56C64 59 62 60 59 58L39 43C30 36 27 27 30 19L49 36Z"/></svg>
    <b>NuitSignal</b><span>Architecture logicielle</span>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Position dans le schéma"></nav>
  <div class="levels" role="group" aria-label="Niveau de détail">
    <button type="button" data-lv="0" aria-pressed="true"><i>1</i>Composants</button>
    <button type="button" data-lv="1" aria-pressed="false"><i>2</i>Couches</button>
    <button type="button" data-lv="2" aria-pressed="false"><i>3</i>Modules</button>
  </div>
</header>
<main class="stage">
  <div class="canvas" id="canvas">
    <svg id="svg" class="lv0" role="group" aria-label="Schéma d'architecture interactif de NuitSignal : composants, couches internes et flux d'échange"><g id="world"></g></svg>
    <div class="zoombar">
      <button type="button" id="zin" aria-label="Zoomer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zout" aria-label="Dézoomer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button type="button" id="zfit" aria-label="Vue d'ensemble"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="status" id="status"></div><div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
    <div class="hint" id="hint"><span class="lg">Molette, pincement ou double-clic pour zoomer · glisser pour se déplacer · cliquez un composant pour l'ouvrir</span><span class="sm">Pincez pour zoomer · touchez un composant</span></div>
  </div>
  <aside class="panel" id="panel" aria-label="Inspecteur">
    <button type="button" class="grab" id="grab" aria-expanded="false" aria-controls="pbody"><strong id="grabT">Vue d'ensemble</strong><span id="grabS">Détails</span></button>
    <div class="pbody" id="pbody"></div>
  </aside>
</main>
<script>
{
const FONT='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif', MONO='ui-monospace, "SF Mono", Menlo, monospace';
const L1=1.25, L2=2.3;

/* ───────── Données : composants, couches, modules (dépôt fable-agence-revenue-management, 25/11/2026) ───────── */
const NODES=[
 {id:"owner",ext:1,icon:"user",name:"Propriétaire",short:["Propriétaire"],k0:"Externe · navigateur",kicker:"Navigateur ou mobile",

   {t:"Chat, rapports, audit",d:"Conversation avec un agent, bilans, journal d'audit",c:["/chat","/rapports/[id]/export","/audit-events"]},

 {id:"sched",icon:"clock",name:"Planificateur",short:["Planificateur"],k0:"Tick toutes les 15 min",kicker:"Instrumentation Node · tick 15 min",

/* ───────── Rendu d'un composant ───────── */
const bandRects={};
function card(n,r){
  const ext=!!n.ext,cols=r.w>2.2*r.h,H0=ext?40:46,pad=10,gap=ext?10:14,ly=n.layers,N=ly.length;
  const ts=ext?8:9,ds=ext?5.6:6,cs=5.2,ch=8.4,lh=ds*1.38;
  let s=`<g class="node${ext?" ext":""}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.name+", "+n.kicker)}">`;
  s+=`<rect class="body" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="14"/>`;
  s+=`<g class="l1">${icon(n.icon,r.x+13,r.y+(ext?11:13),ext?14:16,ext?"#9aa4bf":"#a78bfa")}`;
  s+=`<text class="h1" x="${r.x+(ext?33:37)}" y="${r.y+(ext?22:25)}" font-size="${ext?11:13}">${esc(n.name)}</text>`;
  s+=`<text class="h2" x="${r.x+(ext?33:37)}" y="${r.y+(ext?32:37)}" font-size="${ext?6.2:7}">${esc(wrap(n.kicker,ext?6.2:7,r.w-(ext?82:50),1)[0])}</text>`;
  if(ext){const tx=r.x+r.w-40;s+=`<g class="etag"><rect x="${tx}" y="${r.y+10}" width="30" height="10" rx="5"/><text x="${tx+15}" y="${r.y+17}" font-size="5.6" text-anchor="middle">Externe</text></g>`;}
  const top=r.y+H0,bot=r.y+r.h-pad,BR=bandRects[n.id]=[];
  let l2="";
  ly.forEach((L,i)=>{
    let bx,by,bw,bh;
    if(cols){bw=(r.w-2*pad-gap*(N-1))/N;bh=bot-top;bx=r.x+pad+i*(bw+gap);by=top;}
    else{bh=(bot-top-gap*(N-1))/N;bw=r.w-2*pad;bx=r.x+pad;by=top+i*(bh+gap);}
    BR.push({x:bx,y:by,w:bw,h:bh});

    s+=`<g class="band" data-i="${i}"><rect class="bandr b${i%2}" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="8"/>`;
    s+=`<g class="bt" style="--dy:${dy}px">${ext?"":`<text class="bi" x="${bx+8}" y="${tcy}" font-size="6.5">${i+1}</text>`}<text x="${tx}" y="${tcy}" font-size="${ts}">${esc(L.t)}</text>`;
    if(L.s){const sx=tx+tw(L.t,ts,600)+7;s+=`<rect x="${sx}" y="${tcy-ts*.55}" width="3.6" height="3.6" fill="#fcd34d" transform="rotate(45 ${sx+1.8} ${tcy-ts*.55+1.8})"/><text class="st" x="${sx+7}" y="${tcy}" font-size="6">${esc(L.s)}</text>`;}
    s+=`</g></g>`;
    const innerW=bw-(tx-bx)-6;
    if(cols){
      let y=by+ts+10+ds;const dl=wrap(L.d,ds,innerW,3);dl.forEach(t=>{l2+=`<text class="bd" x="${tx}" y="${y}" font-size="${ds}">${esc(t)}</text>`;y+=lh;});
      let cx=tx,cy=y+1;
      for(const c of L.c){const w=tw(c,cs,500,MONO)+7;if(cx+w>bx+bw-6){cx=tx;cy+=ch+3;}if(cy+ch>by+bh-3)break;l2+=`<rect class="cr" x="${cx}" y="${cy}" width="${w}" height="${ch}" rx="4.2"/><text class="ct" x="${cx+3.5}" y="${cy+ch*.68}" font-size="${cs}">${esc(c)}</text>`;cx+=w+3;}
    }else{
      const room=bh-(ts+8)-4,hasC=room>=lh+ch+4&&L.c.length;
      const ml=Math.max(1,Math.floor((room-(hasC?ch+4:0))/lh));
      let y=by+ts+8+ds*.95;wrap(L.d,ds,innerW,ml).forEach(t=>{l2+=`<text class="bd" x="${tx}" y="${y}" font-size="${ds}">${esc(t)}</text>`;y+=lh;});
      if(hasC){let cx=tx;const cy=by+bh-ch-4;const cc=L.c;
        for(let j=0;j<cc.length;j++){const w=tw(cc[j],cs,500,MONO)+7,more=cc.length-j-1,mw=more?tw("+"+more,cs,500,MONO)+7:0;
          if(cx+w+(more?mw+3:0)>bx+bw-6&&j>0){l2+=`<rect class="cr" x="${cx}" y="${cy}" width="${tw("+"+(cc.length-j),cs,500,MONO)+7}" height="${ch}" rx="4.2"/><text class="ct" x="${cx+3.5}" y="${cy+ch*.68}" font-size="${cs}">+${cc.length-j}</text>`;break;}
          l2+=`<rect class="cr" x="${cx}" y="${cy}" width="${w}" height="${ch}" rx="4.2"/><text class="ct" x="${cx+3.5}" y="${cy+ch*.68}" font-size="${cs}">${esc(cc[j])}</text>`;cx+=w+3;}}
    }
  });
  if(!cols)(n.intra||[]).forEach(t=>{
    const i=Math.min(t.a,t.b),A=BR[i],y1=A.y+A.h+1,y2=A.y+A.h+gap-1,x=A.x+(ext?14:12),down=t.b>t.a;
    const tip=down?y2:y1,base=down?y2-3.4:y1+3.4;
    s+=`<g class="ia"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke-width=".9"/><path d="M${x} ${tip}L${x-2.2} ${base}L${x+2.2} ${base}Z" stroke="none"/></g>`;
    l2+=`<text class="il" x="${x+6}" y="${(y1+y2)/2+2}" font-size="${ext?4.8:5.4}">${esc(t.l)}</text>`;
  });
  s+=`</g><g class="l2">${l2}</g>`;
  // niveau 0 : titre à taille d'écran constante
  const lines=n.short,th=22+8+lines.length*18+4+14,y0=-th/2;
  n.box={w:Math.max(...lines.map(t=>tw(t,15,650)),tw(n.k0,12))+18,h:th+10};
  s+=`<g class="l0 cs" data-x="${r.cx}" data-y="${r.cy}">${icon(n.icon,-11,y0,22,ext?"#9aa4bf":"#a78bfa")}`;
  lines.forEach((t,i)=>{s+=`<text class="t0" x="0" y="${y0+22+8+14+i*18}" font-size="15" text-anchor="middle">${esc(t)}</text>`;});
  s+=`<text class="k0" x="0" y="${y0+22+8+lines.length*18+16}" font-size="12" text-anchor="middle">${esc(n.k0)}</text></g>`;
  return s+`</g>`;
}

/* ───────── Construction ───────── */

  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="rgb(255 255 255 / 7%)"/></pattern></defs>`;

  if(frame)s+=`<rect class="frame" x="${frame.x}" y="${frame.y}" width="${frame.w}" height="${frame.h}" rx="22"/><g class="ftab cs" data-x="${frame.x+18}" data-y="${frame.y-10}" data-a="start"><text x="0" y="0" font-size="13">Conteneur NuitSignal · Next.js sur Coolify</text></g>`;

    if(f.k==="write"){const a=p[0],a2=p[1],ang=Math.atan2(a2[1]-a[1],a2[0]-a[0])*180/Math.PI;s+=`<g class="head sq" data-f="${f.i}" data-x="${a[0]}" data-y="${a[1]}" data-r="${ang}"><rect x="0" y="-3.5" width="7" height="7" fill="${c}"/></g>`;}
  });
  s+=`</g><g class="labels">`;
  ROUTES.forEach(f=>{if(!f.l)return;const w=tw(f.l,11.5,500)+16;f.lw=w;
    s+=`<g class="flab" data-f="${f.i}" visibility="hidden"><rect x="${-w/2}" y="-10" width="${w}" height="20" rx="10" stroke-width="1"/><text x="0" y="4" font-size="11.5" font-weight="500" text-anchor="middle">${esc(f.l)}</text></g>`;});
  s+=`</g>`;
  world.innerHTML=s;

  HEADS=[...world.querySelectorAll(".head")].map(el=>({el,x:+el.dataset.x,y:+el.dataset.y,r:el.dataset.r!==undefined?+el.dataset.r:ROUTES.find(f=>f.i==el.dataset.f).ang,f:+el.dataset.f}));

/* ───────── Vue, zoom, niveaux ───────── */
const narrow=()=>matchMedia("(max-width:999px)").matches;
const view=()=>{const w=canvas.clientWidth,h=canvas.clientHeight,ph=narrow()?(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--peek"))||68):0;return {w,h,uh:h-ph};};
const clampK=k=>Math.max(kMin,Math.min(6,k));
let raf=0;const schedule=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;update();});};
function fitTarget(){
  const v=view(),b=LAY.b;
  if(LAY.mode==="land"){const k=Math.min(v.w/b.w,v.uh/b.h);return {cx:b.x+b.w/2,cy:b.y+b.h/2,k};}
  const k=v.w/b.w;return {cx:b.x+b.w/2,cy:b.y+(v.uh/2)/k,k};
}
function setT(cx,cy,k){const v=view();T.k=k;T.x=v.w/2-cx*k;T.y=v.uh/2-cy*k;schedule();}
function center(){const v=view();return {cx:(v.w/2-T.x)/T.k,cy:(v.uh/2-T.y)/T.k};}
let anim=0;
function animateTo(cx,cy,k,dur=650){

    setT(c0.cx+(cx-c0.cx)*e,c0.cy+(cy-c0.cy)*e,Math.exp(Math.log(k0)+(Math.log(k)-Math.log(k0))*e));if(t<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
const stopAnim=()=>cancelAnimationFrame(anim);
function zoomAt(px,py,k){k=clampK(k);const wx=(px-T.x)/T.k,wy=(py-T.y)/T.k;T.k=k;T.x=px-wx*k;T.y=py-wy*k;schedule();}
function fitAll(){const t=fitTarget();animateTo(t.cx,t.cy,t.k);}
function zoomToNode(id){
  const r=LAY.R[id],v=view();if(!r)return;
  let k=Math.min((v.w-32)/r.w,(v.uh-32)/r.h);k=Math.max(L1+.1,Math.min(1.8,k));
  let cy=r.cy;if(r.h*k>v.uh-32)cy=r.y+(v.uh/2-16)/k;
  let cx=r.cx;if(r.w*k>v.w-32)cx=r.x+(v.w/2-16)/k;
  animateTo(cx,cy,k);
}
function lv2At(b){const v=view(),k=v.w<700?L2+.05:L2+.3;const cx=b.w*k>v.w-24?b.x-8+(v.w/2)/k:b.x+b.w/2;animateTo(cx,b.y+b.h/2,Math.max(k,v.w<700?0:T.k));}
function zoomToBand(id,i){lv2At(bandRects[id][i]);}
function update(){

  svg.style.setProperty("--k",k);
  const lv=k>=L2?2:k>=L1?1:0;
  if(lv!==level){level=lv;svg.classList.remove("lv0","lv1","lv2");svg.classList.add("lv"+lv);
    document.querySelectorAll(".levels button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.lv===lv)));document.getElementById("live").textContent="Niveau : "+["Composants","Couches","Modules"][lv];}
  const s=1/k;
  for(const c of CS)c.el.setAttribute("transform",`translate(${c.x} ${c.y}) scale(${s})`);
  for(const h of HEADS)h.el.setAttribute("transform",`translate(${h.x} ${h.y}) rotate(${h.r}) scale(${s})`);
  placeLabels();crumbs();
  document.getElementById("status").textContent=`${["Composants","Couches","Modules"][lv]} · zoom ${Math.round(k*100)} %`;
}
function focusId(){return hoverNode||sel;}
function placeLabels(){
  const k=T.k,v=view(),fid=focusId(),boxes=[];
  if(level===0)for(const n of NODES){const r=LAY.R[n.id];if(!r)continue;const sx=r.cx*k+T.x,sy=r.cy*k+T.y;boxes.push([sx-n.box.w/2,sy-n.box.h/2,sx+n.box.w/2,sy+n.box.h/2]);}
  const on=f=>hoverFlow===f.i||(fid&&(f.from===fid||f.to===fid));
  const order=[...LABS].sort((a,b)=>on(b.f)-on(a.f));
  for(const L of order){
    const f=L.f,force=on(f);

    const segs=[];for(let i=1;i<f.P.length;i++){const a=f.P[i-1],b=f.P[i];segs.push({a,b,len:Math.hypot(b[0]-a[0],b[1]-a[1])});}
    segs.sort((p,q)=>q.len-p.len);

      const x=sg.a[0]+(sg.b[0]-sg.a[0])*t,y=sg.a[1]+(sg.b[1]-sg.a[1])*t,sx=x*k+T.x,sy=y*k+T.y;

      const ov=boxes.filter(o=>bx[0]<o[2]&&bx[2]>o[0]&&bx[1]<o[3]&&bx[3]>o[1]).length;

    <h3>Échanges avec les autres composants</h3><ul class="xf">${out.map(f=>li(f,f.to,"vers")).join("")}${inn.map(f=>li(f,f.from,"depuis")).join("")}</ul>`;
  }
  h+=`<p class="src">Source : dépôt fable-agence-revenue-management, état au 25 novembre 2026 (42 tables, 36 migrations, 13 playbooks, 8 agents).</p>`;
  pb.innerHTML=h;
  document.getElementById("grabT").textContent=sel?byId[sel].name:"Vue d'ensemble";
  document.getElementById("grabS").textContent=sel?`${byId[sel].layers.length} couches`:"Légende";
}
function select(id,zoom){
  sel=id||null;renderPanel();applyFocus();lastCrumb="";
  try{history.replaceState(null,"",sel?"#"+sel:location.pathname+location.search);}catch(e){}
  if(zoom&&sel)zoomToNode(sel);
}

/* ───────── Interactions ───────── */
const hint=document.getElementById("hint");let hintOff=false;
const hideHint=()=>{if(!hintOff){hintOff=true;hint.classList.add("off");}};
setTimeout(hideHint,8000);
function tap(target){
  const ng=target.closest&&target.closest(".node"),id=ng?.dataset.id;
  if(!id){if(level===0)select(null);return;}
  const bg=target.closest(".band");
  if(sel!==id||level===0){select(id,true);return;}
  if(level===1)zoomToBand(id,bg?+bg.dataset.i:0);
}
const pts=new Map();let G=null;
svg.addEventListener("pointerdown",e=>{
  stopAnim();hideHint();try{svg.setPointerCapture(e.pointerId);}catch(_){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)G={t:"pan",sx:e.clientX,sy:e.clientY,x0:T.x,y0:T.y,moved:false,target:e.target};
  else if(pts.size===2){const [a,b]=[...pts.values()],rc=svg.getBoundingClientRect(),mx=(a.x+b.x)/2-rc.left,my=(a.y+b.y)/2-rc.top;
    G={t:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,k0:T.k,wx:(mx-T.x)/T.k,wy:(my-T.y)/T.k,moved:true};}
});
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)||!G)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(G.t==="pan"&&pts.size===1){const dx=e.clientX-G.sx,dy=e.clientY-G.sy;if(!G.moved&&Math.hypot(dx,dy)>6)G.moved=true;if(G.moved){T.x=G.x0+dx;T.y=G.y0+dy;schedule();}}
  else if(G.t==="pinch"&&pts.size===2){const [a,b]=[...pts.values()],rc=svg.getBoundingClientRect(),mx=(a.x+b.x)/2-rc.left,my=(a.y+b.y)/2-rc.top;
    const k=clampK(G.k0*Math.hypot(a.x-b.x,a.y-b.y)/G.d0);T.k=k;T.x=mx-G.wx*k;T.y=my-G.wy*k;schedule();}
});
const endPtr=e=>{
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(G&&G.t==="pan"&&!G.moved&&e.type==="pointerup"&&pts.size===0)tap(G.target);
  if(pts.size===1){const [p]=[...pts.values()];G={t:"pan",sx:p.x,sy:p.y,x0:T.x,y0:T.y,moved:true};}
  else if(pts.size===0)G=null;
};
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{
  e.preventDefault();stopAnim();hideHint();
  const rc=svg.getBoundingClientRect(),px=e.clientX-rc.left,py=e.clientY-rc.top;
  if(e.ctrlKey)zoomAt(px,py,T.k*Math.exp(-e.deltaY*.012));
  else if(e.deltaMode===1||(Math.abs(e.deltaY)>=50&&!e.deltaX))zoomAt(px,py,T.k*Math.exp(-e.deltaY*(e.deltaMode===1?.06:.0022)));
  else{T.x-=e.deltaX;T.y-=e.deltaY;schedule();}
},{passive:false});
svg.addEventListener("dblclick",e=>{const rc=svg.getBoundingClientRect(),px=e.clientX-rc.left,py=e.clientY-rc.top;const k=clampK(T.k*2);const c={cx:(px-T.x)/T.k,cy:(py-T.y)/T.k};const v=view();animateTo(c.cx+(v.w/2-px)/k,c.cy+(v.uh/2-py)/k,k,420);});
if(matchMedia("(hover: hover)").matches){
  world.addEventListener("pointerover",e=>{if(G&&G.moved)return;const n=e.target.closest(".node"),h=e.target.closest(".hit");const nid=n?n.dataset.id:null,hf=h?+h.dataset.f:null;if(nid!==hoverNode||hf!==hoverFlow){hoverNode=nid;hoverFlow=hf;applyFocus();}});
  world.addEventListener("pointerleave",()=>{hoverNode=null;hoverFlow=null;applyFocus();});
}
world.addEventListener("keydown",e=>{const n=e.target.closest&&e.target.closest(".node");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sel===n.dataset.id&&level>=1?animateTo(LAY.R[sel].cx,LAY.R[sel].cy,L2+.3):select(n.dataset.id,true);}});
window.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea,.panel,.levels,.zoombar"))return;
  const v=view();
  if(e.key==="+"||e.key==="=")animateTo(center().cx,center().cy,T.k*1.5,300);
  else if(e.key==="-")animateTo(center().cx,center().cy,T.k/1.5,300);
  else if(e.key==="0")fitAll();
  else if(e.key==="Escape"){select(null);fitAll();}
  else if(e.key.startsWith("Arrow")&&!(e.target.closest&&e.target.closest(".node"))){const d=80;if(e.key==="ArrowLeft")T.x+=d;if(e.key==="ArrowRight")T.x-=d;if(e.key==="ArrowUp")T.y+=d;if(e.key==="ArrowDown")T.y-=d;schedule();}
});
document.getElementById("zin").onclick=()=>{const c=center();animateTo(c.cx,c.cy,T.k*1.6,350);};
document.getElementById("zout").onclick=()=>{const c=center();animateTo(c.cx,c.cy,T.k/1.6,350);};
document.getElementById("zfit").onclick=()=>fitAll();
document.querySelector(".levels").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const lv=+b.dataset.lv,c=center();hideHint();
  if(lv===0)fitAll();
  else if(lv===1)sel?zoomToNode(sel):animateTo(c.cx,c.cy,Math.max(L1+.25,Math.min(T.k,L2-.2)));
  else{const r=sel&&LAY.R[sel];const k=L2+.3;
    if(r){const B=bandRects[sel],inside=level>0&&nodeAt(c.cx,c.cy)===sel;let bi=0;if(inside){let d=1e9;B.forEach((q,i)=>{const dd=Math.abs(q.y+q.h/2-c.cy)+Math.abs(q.x+q.w/2-c.cx);if(dd<d){d=dd;bi=i;}});}lv2At(B[bi]);}else{const v=view();animateTo(c.cx,c.cy,Math.max(v.w<700?L2+.05:k,T.k));}}
});
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"),home=e.target.closest("[data-home]"),act=e.target.closest("[data-act]");
  if(go){const id=go.dataset.go;if(id==="frame"||!own(LAY.R,id)){if(id!=="frame")select(id);return;}select(id,true);panel.classList.remove("open");grab.setAttribute("aria-expanded","false");}
  else if(home){select(null);fitAll();}
  else if(act&&sel){if(act.dataset.act==="layers")zoomToNode(sel);else lv2At(bandRects[sel][0]);panel.classList.remove("open");grab.setAttribute("aria-expanded","false");}
});
const panel=document.getElementById("panel"),grab=document.getElementById("grab");
grab.addEventListener("click",()=>{const o=panel.classList.toggle("open");grab.setAttribute("aria-expanded",String(o));});

/* ───────── Démarrage et redimensionnement ───────── */
const modeFor=()=>{const v=view();return (v.w<760||v.w/v.uh<.9)?"port":"land";};
function start(){
  build(modeFor());const t=fitTarget();kMin=t.k*.5;setT(t.cx,t.cy,t.k);
  renderPanel();
  const h=location.hash.slice(1);if(h&&own(byId,h)&&own(LAY.R,h))setTimeout(()=>select(h,true),300);
}
let lastW=0,lastH=0;
const ro=new ResizeObserver(()=>{const v=view();if(!v.w||!v.h)return;
  if(!LAY){lastW=v.w;lastH=v.h;start();return;}
  if(v.w===lastW&&v.h===lastH)return;
  const m=modeFor();const c=center();lastW=v.w;lastH=v.h;
  if(m!==LAY.mode){build(m);const t=fitTarget();kMin=t.k*.5;setT(t.cx,t.cy,t.k);if(sel&&LAY.R[sel])applyFocus();}
  else{const t=fitTarget();kMin=t.k*.5;setT(c.cx,c.cy,clampK(T.k));}
});
ro.observe(canvas);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(LAY&&h&&h!==sel&&own(byId,h)&&own(LAY.R,h))select(h,true);});
}
</script>
